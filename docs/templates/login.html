<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เข้าสู่ระบบ | ระบบบริหารเอกสาร</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
                background: #edf6fb;
        }

        .login-box {
            background: #fff;
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(10,107,138,0.25);
        }

        .brand-logo {
            width: 62px; height: 62px;
            background: #e8f7fd;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.9rem;
            margin: 0 auto 14px;
            border: 2px solid #c8e8f5;
        }

        .welcome {
            font-size: 1.35rem;
            font-weight: 700;
            color: #1a2e38;
            text-align: center;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #5a7a8a;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.88rem;
            color: #1a2e38;
            margin-bottom: 6px;
        }
        .input-wrapper { position: relative; }
        .form-control {
            border: 1.5px solid #c8e8f5;
            border-radius: 10px;
            padding: 10px 38px 10px 14px;
            font-family: 'Sarabun', sans-serif;
            font-size: 0.95rem;
            color: #1a2e38;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            border-color: #29abe2;
            box-shadow: 0 0 0 3px rgba(41,171,226,0.15);
            outline: none;
        }
        .input-icon {
            position: absolute;
            right: 12px; top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            pointer-events: none;
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #58c9fa, #77d1f8);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-family: 'Sarabun', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(41,171,226,0.35);
            margin-top: 8px;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #1a8fc2, #0f6e9e);
            box-shadow: 0 6px 20px rgba(41,171,226,0.45);
            transform: translateY(-1px);
        }

        .error-box {
            background: #fde8e8;
            border: 1px solid #f5b8b8;
            border-radius: 10px;
            padding: 10px 14px;
            color: #9c2020;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #90b8cc;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="login-box">

        <div class="welcome">ระบบบริหารเอกสาร</div>
        <div class="subtitle">กรุณาเข้าสู่ระบบเพื่อดำเนินการต่อ</div>

        {% if form.errors %}
        <div class="error-box">
            ⚠️ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">ชื่อผู้ใช้งาน</label>
                <div class="input-wrapper">
                    <input type="text" name="username" class="form-control" placeholder="กรอกชื่อผู้ใช้" required autofocus>
                    <span class="input-icon">👤</span>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">รหัสผ่าน</label>
                <div class="input-wrapper">
                    <input type="password" name="password" class="form-control" placeholder="กรอกรหัสผ่าน" required>
                    <span class="input-icon">🔒</span>
                </div>
            </div>

            <button type="submit" class="btn-login">เข้าสู่ระบบ →</button>
        </form>
    </div>

</body>
</html>
